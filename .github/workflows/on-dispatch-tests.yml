name: Run tests on repository_dispatch (v1.0)

on:
  repository_dispatch:
    types: [ run-tests ]
  workflow_dispatch:
    inputs:
      app_under_test_url:
        description: "Base URL to test (manual fallback)"
        required: false
        type: string

jobs:
  run_ui_tests:
    name: Cucumber + Allure UI Tests
    runs-on: ubuntu-latest

    env:
      APP_UNDER_TEST_URL: ${{ github.event.client_payload.calc_url || inputs.app_under_test_url || 'https://avidcutlet.github.io/calculator-app/' }}
      HEADLESS: "true"

    steps:
      - name: ✅ Validate sender repository
        if: ${{ github.event_name == 'repository_dispatch' }}
        run: |
          SRC="${{ github.event.client_payload.source_repo }}"
          EXPECTED="avidcutlet/calculator-app"
          if [ "$SRC" != "$EXPECTED" ]; then
            echo "❌ Unauthorized dispatch from: $SRC"; exit 1;
          fi

      - name: 🧩 Checkout testing repository
        uses: actions/checkout@v4

      - name: ☕ Set up Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: 🌐 Install Chrome browser
        uses: browser-actions/setup-chrome@v1

      - name: 🧰 Set up Node.js for Allure and http-server
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 📦 Install Allure CLI and http-server
        run: npm install -g allure-commandline@2 http-server@14

      - name: 📁 Checkout app repository at dispatched SHA
        if: ${{ github.event_name == 'repository_dispatch' }}
        uses: actions/checkout@v4
        with:
          repository: avidcutlet/calculator-app
          ref: ${{ github.event.client_payload.sha }}
          path: app

      - name: 🚀 Start local web server (background)
        if: ${{ github.event_name == 'repository_dispatch' }}
        working-directory: app/src
        run: |
          npx http-server -p 8080 -c-1 --silent &
          echo $! > /tmp/http-server.pid
          for i in {1..10}; do
            curl -fsS http://127.0.0.1:8080 && break || sleep 1
          done

      - name: 🧭 Decide BASE_URL
        id: baseurl
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "BASE_URL=http://127.0.0.1:8080" >> $GITHUB_OUTPUT
          else
            echo "BASE_URL=${APP_UNDER_TEST_URL}" >> $GITHUB_OUTPUT
          fi

      - name: 🔍 Show resolved test URL
        run: echo "✅ BASE_URL=${{ steps.baseurl.outputs.BASE_URL }}"

      - name: 🧪 Run Cucumber + Allure Tests
        env:
          BASE_URL: ${{ steps.baseurl.outputs.BASE_URL }}
        run: |
          set -e
          mvn -B clean test \
            -DbaseUrl="${BASE_URL}" \
            -Dheadless="${HEADLESS}"

      - name: 🛑 Stop local server
        if: ${{ always() && github.event_name == 'repository_dispatch' }}
        run: |
          if [ -f /tmp/http-server.pid ]; then kill "$(cat /tmp/http-server.pid)" || true; fi

      - name: 📤 Upload raw test reports
        if: ${{ failure() || success() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/**
            **/target/cucumber-reports/**
            **/target/allure-results/**

      - name: 🧷 Generate Allure single-file report
        if: ${{ always() }}
        run: allure generate target/allure-results --single-file --clean -o target/allure-single

      - name: 📦 Upload Allure single-file report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-single-file
          path: target/allure-single